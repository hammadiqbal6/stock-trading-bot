[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-stock-trading-bot"
version = "0.1.0"
description = "Production-quality AI stock trading bot with Alpaca paper trading, walk-forward validation, and pluggable brokers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sidney" }]
dependencies = [
  "alpaca-py>=0.33.0",
  "yfinance>=0.2.40",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.0",
  "ta>=0.11.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "tenacity>=8.2.0",
  "exchange-calendars>=4.5.0",
  "pandas-market-calendars>=4.4.0",
  "pyyaml>=6.0.0",
  "groq>=0.4.0",
  "structlog>=24.1.0",
  "rich>=13.7.0",
  "orjson>=3.9.0",
  "apscheduler>=3.10.0",
  "prometheus-client>=0.20.0",
  "python-dateutil>=2.8.0",
  "pytz>=2024.1",
  "aiofiles>=23.2.0",
  "cachetools>=5.3.0",
]

[project.optional-dependencies]
# Heavy optional stacks — FinBERT/vectorbt degrade gracefully when absent
ml-nlp = [
  "transformers>=4.38.0",
  "torch>=2.2.0",
]
vectorbt = [
  "vectorbt>=0.26.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "pytest-httpx>=0.30.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.3.0",
  "mypy>=1.8.0",
  "pre-commit>=3.6.0",
  "types-cachetools>=5.3.0",
  "types-python-dateutil>=2.8.0",
  "types-pytz>=2024.1.0",
  "types-aiofiles>=23.2.0",
  "types-PyYAML>=6.0.0",
]
e2e = [
  "playwright>=1.41.0",
  "pytest-playwright>=0.4.0",
]
full = [
  "ai-stock-trading-bot[ml-nlp,vectorbt,dev,e2e]",
]

[project.scripts]
trading-bot = "trading_bot.cli:main"
trading-bot-api = "trading_bot.api.app:run"

[tool.hatch.build.targets.wheel]
packages = ["trading_bot"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["trading_bot", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = [
  "vectorbt.*",
  "yfinance.*",
  "alpaca.*",
  "ta.*",
  "xgboost.*",
  "transformers.*",
  "torch.*",
  "groq.*",
  "exchange_calendars.*",
  "pandas_market_calendars.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=trading_bot --cov-report=term-missing --cov-report=xml"
markers = [
  "integration: integration tests with mocked external services",
  "e2e: end-to-end UI tests",
  "slow: slow tests (backtests, model training)",
  "network: tests that hit real network (opt-in)",
]

[tool.coverage.run]
source = ["trading_bot"]
omit = ["trading_bot/cli.py", "trading_bot/api/app.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true

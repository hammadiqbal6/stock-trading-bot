name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,e2e]"
          # Skip heavy torch CPU wheels in CI if needed — transformers pulls torch;
          # keep for FinBERT unit mocks without downloading model weights in tests.

      - name: Ruff
        run: |
          ruff check trading_bot tests
          ruff format --check trading_bot tests

      - name: Mypy (informational)
        continue-on-error: true
        run: mypy trading_bot || true

      - name: Unit + integration tests
        env:
          TRADING_MODE: paper
          ALPACA_PAPER: "true"
        run: pytest tests/unit tests/integration -q --cov=trading_bot --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  # E2E is optional in CI until secrets/browser image available
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev,e2e]"
          playwright install --with-deps chromium
      - name: Start API
        run: |
          uvicorn trading_bot.api.app:app --host 127.0.0.1 --port 8000 &
          sleep 3
        env:
          TRADING_MODE: paper
          EXECUTION_BROKER: paper_sim
      - name: Playwright tests
        run: pytest tests/e2e -q --browser chromium
        env:
          BASE_URL: http://127.0.0.1:8000
